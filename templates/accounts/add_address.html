{% extends "base.html" %}
{% block title %}Add Address — Saagu.farm{% endblock %}

{% block content %}
<section class="py-16 px-6">
    <div class="max-w-xl mx-auto">
        <a href="{% url 'accounts:profile' %}" class="text-sm text-slate-400 hover:text-slate-600 mb-4 inline-block">
            <i class="fas fa-arrow-left mr-1"></i> Back to Profile
        </a>
        <h1 class="text-3xl font-extrabold text-slate-900 mb-8">Add Delivery Address</h1>

        <div class="bg-white border border-slate-100 rounded-[2rem] p-8 shadow-sm">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Label</label>
                        <select name="label" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="Home">Home</option>
                            <option value="Office">Office</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Contact Name</label>
                        <input type="text" name="name" value="{{ user.name }}" required
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Phone</label>
                    <input type="tel" name="phone" value="{{ user.phone }}"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Address Line 1</label>
                    <input type="text" name="address_line1" placeholder="House/Flat No, Building, Street" required
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Address Line 2</label>
                    <input type="text" name="address_line2" placeholder="Area, Landmark (optional)"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">City</label>
                        <input type="text" name="city" value="Hyderabad" required
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">State</label>
                        <input type="text" name="state" value="Telangana" required
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Pincode</label>
                        <input type="text" name="pincode" placeholder="500001" required maxlength="6"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" name="is_default" id="is_default" class="rounded">
                    <label for="is_default" class="text-sm text-slate-600">Set as default address</label>
                </div>

                <button type="submit" class="w-full brand-gradient text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-xl hover:-translate-y-1 transition text-sm uppercase tracking-widest mt-4">
                    Save Address <i class="fas fa-check ml-2"></i>
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
