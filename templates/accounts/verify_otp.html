{% extends "base.html" %}
{% block title %}Verify OTP — Saagu.farm{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-6 py-20">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-shield-alt text-2xl text-green-600"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 mb-2">Verify Your Number</h2>
            <p class="text-slate-400 text-sm italic">Enter the 6-digit code sent to {{ masked_phone }}</p>
        </div>

        <div class="bg-white border border-slate-100 rounded-[2rem] p-8 shadow-xl">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">OTP Code</label>
                    <input type="text" name="otp" placeholder="000000" required maxlength="6" pattern="[0-9]{6}"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 text-2xl font-black text-slate-900 text-center tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                        autofocus autocomplete="one-time-code">
                </div>

                <button type="submit" class="w-full brand-gradient text-white py-4 rounded-xl font-bold shadow-lg hover:shadow-xl hover:-translate-y-1 transition text-sm uppercase tracking-widest">
                    Verify & Login <i class="fas fa-check ml-2"></i>
                </button>
            </form>

            <div class="text-center mt-6">
                <a href="{% url 'accounts:resend_otp' %}" class="text-sm text-green-600 font-bold hover:underline">
                    Didn't receive? Resend OTP
                </a>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'accounts:login' %}" class="text-sm text-slate-400 hover:text-slate-600">
                <i class="fas fa-arrow-left mr-1"></i> Change phone number
            </a>
        </div>
    </div>
</section>
{% endblock %}
